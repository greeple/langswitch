name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-win32:
    name: Windows x86 (XP-compatible)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup MSYS2 / MinGW 32-bit
        uses: msys2/setup-msys2@v2
        with:
          # MINGW32 нужен для 32-битной XP-совместимой сборки (UCRT64 не подходит
          # для старых Windows), поэтому предупреждение о деprecation подавляем.
          msystem: MINGW32
          suppress-deprecation-warnings: msystem-mingw32
          update: true
          install: >-
            mingw-w64-i686-toolchain
            mingw-w64-i686-cmake
            mingw-w64-i686-ninja
            zip

      - name: Configure
        run: cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Verify PE (подсистема 5.01 = Windows XP, только системные DLL)
        run: |
          objdump -p build/LangSwitcher.exe | grep -Ei 'Magic|MajorOperating|MinorOperating|MajorSubsystem|MinorSubsystem'
          echo '--- imports ---'
          objdump -p build/LangSwitcher.exe | grep 'DLL Name' | sort -u

      - name: Package
        run: |
          # Портативная папка: EXE + короткий пользовательский README (из
          # packaging/, без описания сборки) + иконки раскладок, если папка
          # icons/ есть в репозитории. Сборка иконки НЕ генерирует — только
          # копирует готовые. Лицензия в архив не кладётся.
          mkdir -p dist/LangSwitcher
          cp build/LangSwitcher.exe  dist/LangSwitcher/
          cp packaging/README.md     dist/LangSwitcher/README.md
          if compgen -G "icons/*.ico" > /dev/null 2>&1; then
            mkdir -p dist/LangSwitcher/icons
            cp icons/*.ico dist/LangSwitcher/icons/
          fi
          cd dist
          zip -9 -r ../LangSwitcher-win32.zip LangSwitcher

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: LangSwitcher-win32
          path: LangSwitcher-win32.zip

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-win32
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: LangSwitcher-win32

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: LangSwitcher-win32.zip
          generate_release_notes: true
