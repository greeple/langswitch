name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-win32:
    name: Windows x86 (XP-compatible)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 / MinGW 32-bit
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            mingw-w64-i686-toolchain
            mingw-w64-i686-cmake
            mingw-w64-i686-ninja
            zip

      - name: Configure
        run: cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Verify PE (подсистема 5.01 = Windows XP, только системные DLL)
        run: |
          objdump -p build/LangSwitcher.exe | grep -Ei 'Magic|MajorOperating|MinorOperating|MajorSubsystem|MinorSubsystem'
          echo '--- imports ---'
          objdump -p build/LangSwitcher.exe | grep 'DLL Name' | sort -u

      - name: Package
        run: |
          mkdir -p dist
          cp build/LangSwitcher.exe dist/LangSwitcher.exe
          cp README.md LICENSE dist/
          cd dist
          zip -9 ../LangSwitcher-win32.zip LangSwitcher.exe README.md LICENSE

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LangSwitcher-win32
          path: |
            dist/LangSwitcher.exe
            LangSwitcher-win32.zip

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-win32
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: LangSwitcher-win32

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            LangSwitcher.exe
            LangSwitcher-win32.zip
          generate_release_notes: true
